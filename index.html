<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>DailyFlow — Pastel To-Do Workspace</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#8f7cf6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="DailyFlow">
<link rel="apple-touch-icon" href="icons/icon-192.png">

<style>
  :root{
    --white:#ffffff;
    --bg:#f7f7fc;
    --purple:#8f7cf6;
    --purple-2:#b8aafc;
    --purple-3:#eeeaff;
    --blue:#9bd4f7;
    --blue-2:#e7f5ff;
    --text:#2f3142;
    --muted:#8a8fa3;
    --line:#e9e9f2;
    --success:#8dcdb6;
    --danger:#ef9aa7;
    --shadow:0 14px 40px rgba(93,78,160,.10);
  }
  *{box-sizing:border-box}
  body{
    margin:0;
    font-family:Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background:var(--bg);
    color:var(--text);
  }
  button,input,select,textarea{font:inherit}
  button{cursor:pointer}
  .app{
    min-height:100vh;
    display:grid;
    grid-template-columns:240px minmax(0,1fr) 320px;
  }
  .sidebar{
    background:linear-gradient(180deg,#f0ecff 0%,#ebe9ff 52%,#e7f4ff 100%);
    border-right:1px solid rgba(255,255,255,.7);
    padding:28px 20px;
    display:flex;
    flex-direction:column;
    gap:24px;
  }
  .brand{display:flex;align-items:center;gap:12px;font-weight:800;font-size:20px}
  .brand-mark{
    width:38px;height:38px;border-radius:13px;
    background:linear-gradient(135deg,var(--purple),var(--blue));
    display:grid;place-items:center;color:#fff;box-shadow:var(--shadow)
  }
  .nav{display:flex;flex-direction:column;gap:8px}
  .nav button{
    border:0;background:transparent;color:#5c6074;
    padding:12px 14px;border-radius:14px;text-align:left;
    display:flex;align-items:center;justify-content:space-between;
  }
  .nav button:hover,.nav button.active{background:#fff;color:var(--purple);box-shadow:0 6px 18px rgba(93,78,160,.08)}
  .nav small{background:rgba(143,124,246,.12);padding:2px 8px;border-radius:999px}
  .sidebar-spacer{flex:1}
  .sync-card{
    background:rgba(255,255,255,.72);border:1px solid rgba(255,255,255,.8);
    border-radius:18px;padding:14px;
  }
  .sync-card button{
    margin-top:10px;width:100%;border:0;background:var(--text);color:#fff;
    padding:10px;border-radius:12px;
  }

  .main{padding:30px 32px;overflow:auto}
  .topbar{display:flex;align-items:center;justify-content:space-between;gap:18px;margin-bottom:24px}
  .topbar h1{margin:0;font-size:29px}
  .topbar p{margin:5px 0 0;color:var(--muted)}
  .top-actions{display:flex;gap:10px}
  .icon-btn,.primary-btn,.secondary-btn{
    border:0;border-radius:14px;padding:12px 15px;
  }
  .icon-btn,.secondary-btn{background:#fff;color:var(--text);border:1px solid var(--line)}
  .primary-btn{background:linear-gradient(135deg,var(--purple),#7f91f8);color:#fff;box-shadow:0 8px 20px rgba(143,124,246,.25)}
  .summary-grid{
    display:grid;grid-template-columns:1.2fr .8fr;gap:18px;margin-bottom:22px
  }
  .card{background:#fff;border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow)}
  .progress-card{padding:22px}
  .progress-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
  .progress-head h2{margin:0 0 6px;font-size:18px}
  .progress-number{font-size:32px;font-weight:800;color:var(--purple)}
  .progress-track{height:12px;background:var(--purple-3);border-radius:999px;overflow:hidden;margin:18px 0 8px}
  .progress-fill{height:100%;width:0%;background:linear-gradient(90deg,var(--purple),var(--blue));border-radius:inherit;transition:.3s}
  .focus-card{padding:22px;background:linear-gradient(135deg,#fff,#f3efff 70%,#edf8ff)}
  .focus-card h3{margin:0 0 12px}
  .focus-items{display:flex;flex-direction:column;gap:9px}
  .focus-chip{background:#fff;padding:9px 12px;border-radius:12px;border:1px solid var(--line);font-size:14px}
  .section-title{display:flex;justify-content:space-between;align-items:center;margin:18px 0 12px}
  .section-title h2{margin:0;font-size:19px}
  .filters{display:flex;gap:8px;flex-wrap:wrap}
  .filter-btn{border:1px solid var(--line);background:#fff;padding:8px 12px;border-radius:999px;color:var(--muted)}
  .filter-btn.active{background:var(--purple-3);color:var(--purple);border-color:#d7cdfd}
  .task-list{display:flex;flex-direction:column;gap:12px}
  .task{
    background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px;
    transition:.2s;box-shadow:0 8px 20px rgba(47,49,66,.04)
  }
  .task:hover{transform:translateY(-1px);box-shadow:var(--shadow)}
  .task.overdue-card{background:#fff;border:2px solid #e87989;box-shadow:0 8px 20px rgba(191,95,111,.06)}
  .task.overdue-card:hover{box-shadow:0 14px 34px rgba(191,95,111,.11)}
  .task-row{display:grid;grid-template-columns:auto auto 1fr auto;gap:12px;align-items:start}
  .drag-handle{border:0;background:transparent;color:#a5a1bb;font-size:18px;line-height:22px;padding:0 2px;cursor:grab;user-select:none}
  .drag-handle:active{cursor:grabbing}
  .task.dragging{opacity:.45}
  .task{position:relative}
  .task.drop-before::before,.task.drop-after::after{content:"";position:absolute;left:12px;right:12px;height:3px;background:var(--purple);border-radius:999px;box-shadow:0 0 0 3px rgba(143,124,246,.10)}
  .task.drop-before::before{top:-8px}
  .task.drop-after::after{bottom:-8px}
  .check{
    width:22px;height:22px;border:2px solid #c9c5e7;border-radius:7px;background:#fff;
    display:grid;place-items:center;color:#fff;margin-top:2px;padding:0
  }
  .check.checked{background:linear-gradient(135deg,var(--purple),var(--blue));border-color:transparent}
  .check.checked::after{content:"✓";font-weight:800;font-size:14px}
  .task-title{font-weight:700}
  .task.completed .task-title{text-decoration:line-through;color:var(--muted)}
  .meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:7px}
  .pill{font-size:12px;padding:5px 8px;border-radius:999px;background:#f5f5fa;color:#73778b}
  .pill.purple{background:var(--purple-3);color:#6f5cd8}
  .pill.blue{background:var(--blue-2);color:#4b89b4}
  .pill.high{background:#fff0f2;color:#c86c79}
  .pill.blue.due-emphasis{font-weight:700;color:#3f7fae}
  .inline-control-pill{position:relative;display:inline-flex;align-items:center;width:max-content;max-width:100%;flex:0 0 auto;white-space:nowrap;overflow:hidden}
  .pill-native-overlay{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;border:0;margin:0;padding:0}
  .pill-visible-text{display:inline-block;white-space:nowrap;line-height:1.2}
  .category-pill,.priority-pill{border:1px solid transparent;box-shadow:none}
  .category-pill{background:var(--blue-2);color:#526274;border-color:#d3ecfb}
  .category-visible-text{font-weight:650}
  .due-visible-text{font-weight:700}
  .category-color-field{grid-column:1/-1}
  .color-choice-row{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
  .color-swatch{width:28px;height:28px;border-radius:9px;border:2px solid #fff;box-shadow:0 0 0 1px #d9dce8;cursor:pointer;padding:0}
  .color-swatch.selected{box-shadow:0 0 0 2px #7263d6}
  .custom-color-wrap{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:#fbfbfe;border-radius:11px;padding:4px 8px}
  .custom-color-wrap input[type="color"]{width:28px;height:28px;padding:0;border:0;background:transparent;border-radius:8px;cursor:pointer}
  .custom-color-wrap span{font-size:12px;color:#6f7285;font-weight:700}
  .start-date-display{font-size:12px;font-weight:650;color:#697084;white-space:nowrap}
  .date-arrow{font-size:12px;color:#a0a4b4;font-weight:700}
  .date-range-inline{display:inline-flex;align-items:center;gap:6px;flex-wrap:wrap}
  .custom-category-row{display:flex;gap:8px;align-items:center}
  .custom-category-row input{flex:1;min-width:0}
  .priority-pill{color:#73778b}
  .priority-pill .pill-visible-text{font-weight:650}
  .priority-pill.priority-low{background:#e8f6ec;color:#73778b;border-color:#cfe8d6}
  .priority-pill.priority-medium{background:#fff7d9;color:#73778b;border-color:#f0e3a9}
  .priority-pill.priority-high{background:#fdebed;color:#73778b;border-color:#f2cfd4}
  .quick-subtask-row{display:flex;align-items:center;gap:8px;margin-top:10px;margin-left:34px}
  .quick-subtask-btn{border:0;background:var(--purple-3);color:#6653c5;padding:7px 10px;border-radius:10px;font-size:12px;font-weight:700}
  .quick-subtask-editor{display:none;align-items:center;gap:6px;flex:1}
  .quick-subtask-editor.open{display:flex}
  .quick-subtask-editor input{flex:1;min-width:120px;border:1px solid var(--line);background:#fff;border-radius:10px;padding:7px 9px;font-size:12px}
  .quick-subtask-editor button{border:0;border-radius:9px;padding:7px 9px;font-size:12px;font-weight:700}
  .task-actions{display:flex;gap:6px}
  .task-actions button{border:0;background:#f7f7fb;border-radius:10px;width:32px;height:32px;color:#7f8294}
  .subtasks{margin:14px 0 0 34px;padding-top:12px;border-top:1px dashed var(--line);display:flex;flex-direction:column;gap:10px}
  .subtask{display:flex;align-items:center;gap:10px;font-size:14px;padding:5px 7px;border-radius:10px}
  .subtask.dragging{opacity:.45}
  .subtask{position:relative}
  .subtask.drop-before::before,.subtask.drop-after::after{content:"";position:absolute;left:4px;right:4px;height:2px;background:var(--blue);border-radius:999px}
  .subtask.drop-before::before{top:-5px}
  .subtask.drop-after::after{bottom:-5px}
  .subtask-drag-handle{border:0;background:transparent;color:#aaa5bd;font-size:15px;cursor:grab;padding:0 2px;line-height:18px}
  .subtask-drag-handle:active{cursor:grabbing}
  .subtask.done span{text-decoration:line-through;color:var(--muted)}
  .mini-check{width:18px;height:18px;border:2px solid #cbc7e5;border-radius:6px;background:#fff;padding:0}
  .mini-check.done{background:var(--purple);border-color:var(--purple)}
  .mini-check.done::after{content:"✓";color:#fff;font-size:11px;font-weight:800}
  .task-progress{margin-top:10px;height:6px;background:#f0eef8;border-radius:999px;overflow:hidden}
  .task-progress span{display:block;height:100%;background:linear-gradient(90deg,var(--purple-2),var(--blue));width:0%}
  .empty{padding:42px;text-align:center;color:var(--muted);background:#fff;border:1px dashed #d9d8e4;border-radius:20px}

  .rightbar{padding:30px 22px 30px 0;display:flex;flex-direction:column;gap:18px}
  .mini-card{padding:18px}
  .mini-card h3{margin:0 0 12px;font-size:16px}
  .calendar-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
  .calendar-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;font-size:12px}
  .calendar-grid div{text-align:center;padding:8px 0;border-radius:9px;color:#7f8294}
  .calendar-grid .dow{font-weight:700;color:#a1a4b5}
  .calendar-grid .today{background:linear-gradient(135deg,var(--purple),var(--blue));color:#fff;font-weight:800}
  .calendar-grid .selected:not(.today){background:var(--purple-3);color:var(--purple);font-weight:800}
  .calendar-grid .date-cell{cursor:pointer}
  .calendar-grid .has-task{box-shadow:inset 0 -3px 0 var(--purple-2)}
  .deadline{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}
  .deadline:last-child{border-bottom:0}
  .dot{width:10px;height:10px;border-radius:50%;background:var(--purple);margin-top:5px}
  .deadline small{display:block;color:var(--muted);margin-top:2px}
  .toggle-row{display:flex;justify-content:space-between;align-items:center}
  .switch{width:44px;height:24px;border:0;border-radius:999px;background:#d9dbe6;padding:3px}
  .switch span{display:block;width:18px;height:18px;border-radius:50%;background:#fff;transition:.2s}
  .switch.on{background:var(--purple)}
  .switch.on span{transform:translateX(20px)}

  .view{display:none}
  .view.active{display:block}
  .completed-day{margin-bottom:18px}
  .completed-day h3{font-size:15px;color:#65697c;margin:0 0 8px}
  .calendar-large{padding:22px}
  .calendar-large .calendar-grid div{padding:16px 0;font-size:14px}
  .timeline{padding:20px}
  .timeline-row{display:grid;grid-template-columns:180px 1fr;gap:16px;align-items:center;margin-bottom:16px}
  .bar-bg{height:16px;background:#f2f1f8;border-radius:999px;position:relative;overflow:hidden}
  .bar{height:100%;border-radius:999px;background:linear-gradient(90deg,var(--purple),var(--blue));}

  .modal{
    position:fixed;inset:0;background:rgba(37,38,55,.28);display:none;place-items:center;padding:20px;z-index:20
  }
  .modal.open{display:grid}
  .modal-panel{width:min(620px,100%);max-height:92vh;overflow:auto;background:#fff;border-radius:24px;padding:24px;box-shadow:0 24px 70px rgba(34,33,59,.22)}
  .modal-head{display:flex;justify-content:space-between;align-items:center}
  .modal-head h2{margin:0}
  .close{border:0;background:#f4f4f8;width:34px;height:34px;border-radius:10px}
  .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:18px}
  .field{display:flex;flex-direction:column;gap:7px}
  .field.full{grid-column:1/-1}
  label{font-size:13px;color:#6f7285;font-weight:700}
  input,select,textarea{
    border:1px solid var(--line);border-radius:12px;padding:11px 12px;outline:none;background:#fbfbfe
  }
  input:focus,select:focus,textarea:focus{border-color:var(--purple-2);box-shadow:0 0 0 3px var(--purple-3)}
  textarea{min-height:90px;resize:vertical}
  .subtask-builder{display:flex;gap:8px}
  .subtask-builder input{flex:1}
  .subtask-tags{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
  .subtask-tag{background:var(--purple-3);color:#6653c5;padding:7px 10px;border-radius:999px;font-size:13px}
  .modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:20px}
  .toast{
    position:fixed;right:24px;bottom:24px;background:#2f3142;color:#fff;
    padding:12px 16px;border-radius:14px;opacity:0;transform:translateY(12px);pointer-events:none;transition:.25s;z-index:30
  }
  .toast.show{opacity:1;transform:translateY(0)}
  @media(max-width:1100px){
    .app{grid-template-columns:210px 1fr}
    .rightbar{display:none}
  }
  @media(max-width:760px){
    .app{grid-template-columns:1fr}
    .sidebar{display:none}
    .main{padding:20px}
    .summary-grid{grid-template-columns:1fr}
    .form-grid{grid-template-columns:1fr}
    .field.full{grid-column:auto}
  }
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand"><div class="brand-mark">✓</div>DailyFlow</div>
    <nav class="nav">
      <button class="nav-btn active" data-view="today">Today <small id="todayCount">0</small></button>
      <button class="nav-btn" data-view="upcoming">Upcoming</button>
      <button class="nav-btn" data-view="calendar">Calendar</button>
      <button class="nav-btn" data-view="all">All Tasks</button>
      <button class="nav-btn" data-view="completed">Completed</button>
    </nav>
    <div class="sidebar-spacer"></div>
  </aside>

  <main class="main">
    <div class="topbar">
      <div>
        <h1 id="pageTitle">Today</h1>
        <p id="dateText"></p>
      </div>
      <div class="top-actions">
        <button class="secondary-btn" id="archiveDay">Finish Day</button>
        <button class="primary-btn" id="openModal">+ Add Task</button>
      </div>
    </div>

    <section id="todayView" class="view active">
      <div class="summary-grid">
        <div class="card progress-card">
          <div class="progress-head">
            <div>
              <h2>Daily Progress</h2>
              <div id="progressCopy" style="color:var(--muted)">0 of 0 completed</div>
            </div>
            <div class="progress-number" id="progressNumber">0%</div>
          </div>
          <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
          <div style="font-size:13px;color:var(--muted)">Main tasks update based on their subtasks.</div>
        </div>
        <div class="card focus-card">
          <h3>Daily Focus</h3>
          <div class="focus-items" id="focusItems"></div>
        </div>
      </div>
      <div class="section-title">
        <h2>Today’s Tasks</h2>
        <div class="filters">
          <button class="filter-btn active" data-filter="all">All</button>
          <button class="filter-btn" data-filter="open">Open</button>
          <button class="filter-btn" data-filter="done">Done</button>
        </div>
      </div>
      <div class="task-list" id="todayTasks"></div>
    </section>

    <section id="upcomingView" class="view">
      <div class="section-title"><h2>Upcoming Tasks</h2></div>
      <div class="task-list" id="upcomingTasks"></div>
    </section>

    <section id="calendarView" class="view">
      <div class="card calendar-large">
        <div class="section-title">
          <h2>Month View</h2>
          <button class="secondary-btn" id="toggleTimeline">Show Timeline</button>
        </div>
        <div id="largeCalendar"></div>
      </div>
      <div class="card timeline" id="timelinePanel" style="display:none;margin-top:18px">
        <div class="section-title"><h2>Task Timeline</h2></div>
        <div id="timelineRows"></div>
      </div>
    </section>

    <section id="allView" class="view">
      <div class="section-title"><h2>All Tasks</h2></div>
      <div class="task-list" id="allTasks"></div>
    </section>

    <section id="completedView" class="view">
      <div class="section-title"><h2>Completed History</h2></div>
      <div id="completedHistory"></div>
    </section>
  </main>

  <aside class="rightbar">
    <div class="card mini-card">
      <div class="calendar-head"><h3>Calendar</h3><span id="monthLabel" style="color:var(--muted);font-size:13px"></span></div>
      <div class="calendar-grid" id="miniCalendar"></div>
    </div>
    <div class="card mini-card">
      <h3>Upcoming Deadlines</h3>
      <div id="deadlineList"></div>
    </div>
  </aside>
</div>

<div class="modal" id="taskModal">
  <div class="modal-panel">
    <div class="modal-head"><h2 id="modalTitle">Add a Task</h2><button class="close" id="closeModal">×</button></div>
    <div class="form-grid">
      <div class="field full"><label>Task name</label><input id="taskName" placeholder="Example: Finish portfolio case study"></div>
      <div class="field"><label>Start date</label><input id="startDate" type="date"></div>
      <div class="field"><label>Due date</label><input id="dueDate" type="date"></div>
      <div class="field"><label>Category</label>
        <select id="category"></select>
      </div>
      <div class="field"><label>Add custom category</label>
        <div class="custom-category-row"><input id="newCategoryName" placeholder="New category"><button class="secondary-btn" id="saveNewCategory" type="button">Save</button></div>
      </div>
      <div class="field category-color-field">
        <label>Category color</label>
        <div class="color-choice-row" id="categoryColorPresets"></div>
      </div>
      <div class="field"><label>Priority</label>
        <select id="priority"><option>Medium</option><option>High</option><option>Low</option></select>
      </div>
      <div class="field"><label>Daily Focus</label>
        <select id="focus"><option value="false">No</option><option value="true">Yes</option></select>
      </div>
      <div class="field full">
        <label>Subtasks</label>
        <div class="subtask-builder"><input id="subtaskInput" placeholder="Add a smaller step"><button class="secondary-btn" id="addSubtask" type="button">Add</button></div>
        <div class="subtask-tags" id="subtaskTags"></div>
      </div>
      <div class="field full"><label>Notes</label><textarea id="notes" placeholder="Optional details"></textarea></div>
    </div>
    <div class="modal-actions"><button class="secondary-btn" id="cancelModal">Cancel</button><button class="primary-btn" id="saveTask">Save Task</button></div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script src="./order-utils.js"></script>
<script src="./task-inline-edit-utils.js"></script>
<script>
const STORAGE_KEY = "dailyflow_tasks_v1";
const ARCHIVE_KEY = "dailyflow_archive_v1";
const SETTINGS_KEY = "dailyflow_settings_v1";

const iso = d => {
  const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,"0"), day=String(d.getDate()).padStart(2,"0");
  return `${y}-${m}-${day}`;
};
const getToday = () => iso(new Date());
let selectedDate = getToday();
let lastKnownToday = selectedDate;
let followRealToday = true;
const plusDays = n => { const d=new Date(); d.setDate(d.getDate()+n); return iso(d); };

const defaults = [
  {id:crypto.randomUUID(),title:"Complete discussion board reply",start:getToday(),due:getToday(),category:"School",priority:"High",focus:true,completed:false,notes:"",subtasks:[
    {id:crypto.randomUUID(),title:"Read peer response",done:true},
    {id:crypto.randomUUID(),title:"Write reply in my voice",done:false}
  ]},
  {id:crypto.randomUUID(),title:"Organize portfolio images",start:getToday(),due:plusDays(3),category:"School",priority:"Medium",focus:true,completed:false,notes:"",subtasks:[
    {id:crypto.randomUUID(),title:"Select final images",done:false},

let tasks = JSON.parse(localStorage.getItem(STORAGE_KEY) || "null") || defaults;
let archive = JSON.parse(localStorage.getItem(ARCHIVE_KEY) || "{}");
let settings = JSON.parse(localStorage.getItem(SETTINGS_KEY) || '{}');
settings.categories = DailyFlowInlineEdit.normalizeCategories(settings.categories || ["School","Work","Personal"], tasks);
settings.categoryColors = DailyFlowInlineEdit.normalizeCategoryColors(settings.categoryColors || {}, settings.categories);
for(const task of tasks){ delete task.reminder; }
delete settings.notifications;
let pendingCategoryColor = null;
let pendingSubtasks = [];
let editingTaskId = null;
let currentFilter = "all";
let draggedTaskId = null;
let draggedSubtask = null;
tasks = DailyFlowOrder.normalizeItemOrder(tasks).map(task => ({
  ...task,
  subtasks: DailyFlowOrder.normalizeItemOrder(task.subtasks || [])
}));
function ordered(list){ return DailyFlowOrder.normalizeItemOrder(list); }
function normalizeOrder(){ tasks=DailyFlowOrder.normalizeItemOrder(tasks); }

function save(){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
  localStorage.setItem(ARCHIVE_KEY, JSON.stringify(archive));
  localStorage.setItem(SETTINGS_KEY, JSON.stringify(settings));
}
function showToast(msg){
  const t=document.getElementById("toast"); t.textContent=msg; t.classList.add("show");
  setTimeout(()=>t.classList.remove("show"),1800);
}
function taskPercent(task){
  if(task.subtasks && task.subtasks.length){
    return Math.round(task.subtasks.filter(s=>s.done).length/task.subtasks.length*100);
  }
  return task.completed ? 100 : 0;
}
function isTaskDone(task){
  return task.completed || (task.subtasks?.length && task.subtasks.every(s=>s.done));
}
function syncTaskCompletion(task){
  if(task.subtasks?.length) task.completed = task.subtasks.every(s=>s.done);
}
function pillSlug(value){ return String(value||"other").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"") || "other"; }
const CATEGORY_COLOR_PRESETS=[
  {name:"Pastel Blue",value:"#e7f5ff"},
  {name:"Pastel Purple",value:"#eeeaff"},
  {name:"Soft Pink",value:"#fff0f5"},
  {name:"Soft Green",value:"#e8f6ec"},
  {name:"Soft Yellow",value:"#fff7d9"},
  {name:"Soft Red",value:"#fdebed"},
  {name:"Soft Peach",value:"#fff3e8"}
];
function categoryColor(category){
  return settings.categoryColors?.[category] || "#e7f5ff";
}
function categoryColorStyle(category){
  const bg=categoryColor(category);
  const fg=DailyFlowInlineEdit.readableTextColor(bg);
  return `background:${bg};color:${fg};border-color:rgba(82,98,116,.12)`;
}
function categoryOptions(selected){
  return settings.categories.map(c=>`<option value="${escapeHtml(c)}" ${selected===c?"selected":""}>${escapeHtml(c)}</option>`).join("");
}
function refreshCategoryField(selected){
  const el=document.getElementById("category"); if(!el)return;
  const chosen=selected || el.value || "School";
  el.innerHTML=categoryOptions(chosen);
  el.value=settings.categories.includes(chosen)?chosen:"School";
  pendingCategoryColor=categoryColor(el.value);
  renderCategoryColorPicker();
}
function renderCategoryColorPicker(){
  const host=document.getElementById("categoryColorPresets"); if(!host)return;
  const active=DailyFlowInlineEdit.normalizeHexColor(pendingCategoryColor) || "#e7f5ff";
  host.innerHTML=CATEGORY_COLOR_PRESETS.map(p=>`
    <button type="button" class="color-swatch ${active===p.value?"selected":""}" style="background:${p.value}" title="${p.name}" aria-label="${p.name}" onclick="chooseCategoryColor('${p.value}')"></button>
  `).join("") + `
    <label class="custom-color-wrap">
      <input id="customCategoryColor" type="color" value="${active}" title="Custom category color" onchange="chooseCategoryColor(this.value)">
      <span>Custom</span>

}
window.chooseCategoryColor=value=>{
  const clean=DailyFlowInlineEdit.normalizeHexColor(value); if(!clean)return;
  pendingCategoryColor=clean;
  renderCategoryColorPicker();
};
function renderTask(task){
  const pct=taskPercent(task);
  const overdue=DailyFlowOrder.isOverdue(task,selectedDate);
  return `
  <div class="task ${isTaskDone(task)?"completed":""} ${overdue && !isTaskDone(task)?"overdue-card":""}" data-id="${task.id}" ondragover="allowTaskDrop(event,'${task.id}')" ondragleave="clearTaskDrop(event)" ondrop="dropTask(event,'${task.id}')">
    <div class="task-row">
      <button class="drag-handle" draggable="true" title="Drag to reorder" ondragstart="startTaskDrag(event,'${task.id}')" ondragend="endTaskDrag(event)">⋮⋮</button>
      <button class="check ${isTaskDone(task)?"checked":""}" onclick="toggleTask('${task.id}')"></button>
      <div>
        <div class="task-title">${escapeHtml(task.title)}</div>
        <div class="meta">
          <span class="pill category-pill inline-control-pill" style="${categoryColorStyle(task.category)}">
            <span class="pill-visible-text category-visible-text">${escapeHtml(task.category)}</span>
            <select class="pill-native-overlay" title="Change category" aria-label="Change category" onchange="inlineCategory('${task.id}',this.value)">
              ${categoryOptions(task.category)}
            </select>
          </span>
          <span class="date-range-inline">
            <span class="start-date-display">${DailyFlowInlineEdit.formatDisplayDate(task.start)}</span>
            <span class="date-arrow">→</span>
            <span class="pill blue inline-control-pill ${overdue?"due-emphasis":""}">
              <span class="pill-visible-text due-visible-text">${DailyFlowInlineEdit.formatDisplayDate(task.due)}</span>
              <input class="pill-native-overlay" type="date" value="${task.due}" title="Change due date" aria-label="Change due date" onchange="inlineDueDate('${task.id}',this.value)">
            </span>
          </span>
          <span class="pill priority-pill priority-${pillSlug(task.priority)} inline-control-pill">
            <span class="pill-visible-text">${escapeHtml(task.priority)}</span>
            <select class="pill-native-overlay" title="Change priority" aria-label="Change priority" onchange="inlinePriority('${task.id}',this.value)">
              ${["Low","Medium","High"].map(p=>`<option value="${p}" ${task.priority===p?"selected":""}>${p}</option>`).join("")}
            </select>
          </span>
        </div>
        ${task.subtasks?.length ? `
          <div class="task-progress"><span style="width:${pct}%"></span></div>
          <div class="subtasks">
            ${ordered(task.subtasks).map(s=>`
              <div class="subtask ${s.done?"done":""}" data-subtask-id="${s.id}" ondragover="allowSubtaskDrop(event,'${task.id}','${s.id}')" ondragleave="clearSubtaskDrop(event)" ondrop="dropSubtask(event,'${task.id}','${s.id}')">
                <button class="subtask-drag-handle" draggable="true" title="Drag to reorder subtask" ondragstart="startSubtaskDrag(event,'${task.id}','${s.id}')" ondragend="endSubtaskDrag(event)">⋮⋮</button>
                <button class="mini-check ${s.done?"done":""}" onclick="toggleSubtask('${task.id}','${s.id}')"></button>
                <span>${escapeHtml(s.title)}</span>
              </div>`).join("")}
          </div>`:""}
        <div class="quick-subtask-row">
          <button class="quick-subtask-btn" type="button" onclick="showQuickSubtask('${task.id}')">+ Subtask</button>
          <div class="quick-subtask-editor" id="quick-subtask-${task.id}">
            <input id="quick-subtask-input-${task.id}" placeholder="Add subtask" onkeydown="quickSubtaskKey(event,'${task.id}')">
            <button type="button" class="primary-btn" onclick="saveQuickSubtask('${task.id}')">Add</button>
            <button type="button" class="secondary-btn" onclick="hideQuickSubtask('${task.id}')">Cancel</button>
          </div>
        </div>
      </div>
      <div class="task-actions">
        <button title="Edit task" onclick="editTask('${task.id}')">✎</button>
        <button title="Set focus" onclick="toggleFocus('${task.id}')">★</button>
        <button title="Delete" onclick="deleteTask('${task.id}')">×</button>
      </div>
    </div>
  </div>`;
}
function escapeHtml(str){
  return String(str).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[m]));
}
window.toggleTask=id=>{
  const t=tasks.find(x=>x.id===id); if(!t)return;
  const next=!isTaskDone(t);
  t.completed=next;
  if(!next)t.completedDate=null;
  if(t.subtasks?.length) t.subtasks.forEach(s=>s.done=next);
  save(); render(); showToast(next?"Task completed":"Task moved back to active");
};
window.toggleSubtask=(tid,sid)=>{
  const t=tasks.find(x=>x.id===tid); const s=t?.subtasks.find(x=>x.id===sid); if(!s)return;
  s.done=!s.done; syncTaskCompletion(t);
  if(!isTaskDone(t))t.completedDate=null;
  save(); render();
};
window.deleteTask=id=>{
  tasks=tasks.filter(t=>t.id!==id); save(); render(); showToast("Task deleted");
};
window.toggleFocus=id=>{
  const t=tasks.find(x=>x.id===id); if(!t)return;
  t.focus=!t.focus; save(); render(); showToast(t.focus?"Added to Daily Focus":"Removed from Daily Focus");
};
window.inlineCategory=(id,value)=>{
  if(DailyFlowInlineEdit.updateCategory(tasks,id,value)){
    if(!settings.categoryColors[value]) settings.categoryColors[value]="#e7f5ff";
    save();render();showToast(`Category changed to ${value}`);
  }
};
window.inlinePriority=(id,value)=>{
  if(DailyFlowInlineEdit.updatePriority(tasks,id,value)){save();render();showToast(`Priority changed to ${value}`);}
};
window.inlineDueDate=(id,value)=>{
  if(DailyFlowInlineEdit.updateDueDate(tasks,id,value)){save();render();showToast("Due date updated");}
  else { render(); showToast("Due date cannot be earlier than the start date"); }
};
window.showQuickSubtask=id=>{
  document.getElementById(`quick-subtask-${id}`)?.classList.add("open");
  setTimeout(()=>document.getElementById(`quick-subtask-input-${id}`)?.focus(),0);
};
window.hideQuickSubtask=id=>{
  const editor=document.getElementById(`quick-subtask-${id}`);
  const input=document.getElementById(`quick-subtask-input-${id}`);
  editor?.classList.remove("open"); if(input)input.value="";
};
window.saveQuickSubtask=id=>{
  const input=document.getElementById(`quick-subtask-input-${id}`);
  if(!input)return;
  const title=input.value.trim(); if(!title){showToast("Enter a subtask first");return;}
  if(DailyFlowInlineEdit.addSubtask(tasks,id,title,crypto.randomUUID())){save();render();showToast("Subtask added");}
};
window.quickSubtaskKey=(event,id)=>{
  if(event.key==="Enter"){event.preventDefault();saveQuickSubtask(id);}
  if(event.key==="Escape"){event.preventDefault();hideQuickSubtask(id);}
};

window.startTaskDrag=(event,id)=>{
  draggedTaskId=id;
  event.dataTransfer.effectAllowed="move";
  event.dataTransfer.setData("text/plain",id);
  event.currentTarget.closest(".task")?.classList.add("dragging");
};
function clearDropLines(selector=".drop-before,.drop-after"){
  document.querySelectorAll(selector).forEach(x=>x.classList.remove("drop-before","drop-after"));
}
function dropPositionForEvent(event,element){
  const rect=element.getBoundingClientRect();
  return event.clientY < rect.top + rect.height/2 ? "before" : "after";
}
window.allowTaskDrop=(event,id)=>{
  if(!draggedTaskId || draggedTaskId===id)return;
  event.preventDefault();
  const el=event.currentTarget;
  el.classList.remove("drop-before","drop-after");
  el.classList.add(`drop-${dropPositionForEvent(event,el)}`);
};
window.clearTaskDrop=event=>event.currentTarget.classList.remove("drop-before","drop-after");
window.endTaskDrag=event=>{
  event.currentTarget.closest(".task")?.classList.remove("dragging");
  clearDropLines();
  draggedTaskId=null;
};
window.dropTask=(event,targetId)=>{
  event.preventDefault();
  const el=event.currentTarget;
  const position=dropPositionForEvent(event,el);
  el.classList.remove("drop-before","drop-after");
  const sourceId=draggedTaskId || event.dataTransfer.getData("text/plain");
  if(!sourceId || sourceId===targetId)return;
  tasks=DailyFlowOrder.reorderById(tasks,sourceId,targetId,position);
  save(); render(); showToast("Task order updated");
};

window.startSubtaskDrag=(event,taskId,subtaskId)=>{
  draggedSubtask={taskId,subtaskId};
  event.stopPropagation();
  event.dataTransfer.effectAllowed="move";
  event.dataTransfer.setData("text/plain",`${taskId}:${subtaskId}`);
  event.currentTarget.closest(".subtask")?.classList.add("dragging");
};
window.allowSubtaskDrop=(event,taskId,targetSubtaskId)=>{
  if(!draggedSubtask || draggedSubtask.taskId!==taskId || draggedSubtask.subtaskId===targetSubtaskId)return;
  event.preventDefault();
  event.stopPropagation();
  const el=event.currentTarget;
  el.classList.remove("drop-before","drop-after");
  el.classList.add(`drop-${dropPositionForEvent(event,el)}`);
};
window.clearSubtaskDrop=event=>{ event.currentTarget.classList.remove("drop-before","drop-after"); };
window.endSubtaskDrag=event=>{
  event.currentTarget.closest(".subtask")?.classList.remove("dragging");
  clearDropLines(".subtask.drop-before,.subtask.drop-after");
  draggedSubtask=null;
};
window.dropSubtask=(event,taskId,targetSubtaskId)=>{
  event.preventDefault();
  event.stopPropagation();
  const el=event.currentTarget;
  const position=dropPositionForEvent(event,el);
  el.classList.remove("drop-before","drop-after");
  const task=tasks.find(t=>t.id===taskId);
  if(!task)return;
  let sourceSubtaskId=draggedSubtask?.subtaskId;
  if(!sourceSubtaskId){
    const raw=event.dataTransfer.getData("text/plain");
    const parts=raw.split(":");
    if(parts[0]===taskId)sourceSubtaskId=parts.slice(1).join(":");
  }
  if(!sourceSubtaskId || sourceSubtaskId===targetSubtaskId)return;
  task.subtasks=DailyFlowOrder.reorderById(task.subtasks||[],sourceSubtaskId,targetSubtaskId,position);
  save(); render(); showToast("Subtask order updated");
};

function updateSelectedDateHeader(){
  const d=new Date(selectedDate+"T12:00:00");
  const isToday=selectedDate===getToday();
  document.getElementById("pageTitle").textContent=isToday?"Today":d.toLocaleDateString(undefined,{month:"long",day:"numeric"});
  document.getElementById("dateText").textContent=d.toLocaleDateString(undefined,{weekday:"long",month:"long",day:"numeric",year:"numeric"});
}
window.selectCalendarDate=date=>{
  selectedDate=date;
  followRealToday=date===getToday();
  document.querySelectorAll(".nav-btn").forEach(x=>x.classList.toggle("active",x.dataset.view==="today"));
  document.querySelectorAll(".view").forEach(v=>v.classList.remove("active"));
  document.getElementById("todayView").classList.add("active");
  updateSelectedDateHeader(); render();
};

function render(){
  const isLiveToday=followRealToday && selectedDate===getToday();
  const todays=ordered(DailyFlowOrder.activeTasksForDate(tasks,selectedDate,isLiveToday));
  const visible=todays.filter(t=>currentFilter==="all" || (currentFilter==="done"?isTaskDone(t):!isTaskDone(t)));
  document.getElementById("todayTasks").innerHTML=visible.length?visible.map(renderTask).join(""):`<div class="empty">No tasks in this view.</div>`;
  document.getElementById("todayCount").textContent=todays.length;

  const totalUnits=todays.reduce((sum,t)=>sum+(t.subtasks?.length||1),0);
  const doneUnits=todays.reduce((sum,t)=>sum+(t.subtasks?.length?t.subtasks.filter(s=>s.done).length:(isTaskDone(t)?1:0)),0);
  const pct=totalUnits?Math.round(doneUnits/totalUnits*100):0;
  document.getElementById("progressCopy").textContent=`${doneUnits} of ${totalUnits} completed`;
  document.getElementById("progressNumber").textContent=`${pct}%`;
  document.getElementById("progressFill").style.width=`${pct}%`;

  const focus=todays.filter(t=>t.focus && !isTaskDone(t)).slice(0,3);
  document.getElementById("focusItems").innerHTML=focus.length?focus.map(t=>`<div class="focus-chip">${escapeHtml(t.title)}</div>`).join(""):`<div style="color:var(--muted);font-size:14px">Choose up to three focus tasks using ★.</div>`;

  const upcoming=ordered(tasks.filter(t=>t.start>getToday() || t.due>getToday())).sort((a,b)=>a.due.localeCompare(b.due)||(a.order??0)-(b.order??0));
  document.getElementById("upcomingTasks").innerHTML=upcoming.length?upcoming.map(renderTask).join(""):`<div class="empty">No upcoming tasks.</div>`;
  document.getElementById("allTasks").innerHTML=tasks.length?ordered(tasks).map(renderTask).join(""):`<div class="empty">No tasks yet.</div>`;

  renderCompleted();
  renderCalendar();
  renderDeadlines();
  renderTimeline();
}
function renderCompleted(){
  const groups={};
  tasks.filter(t=>Boolean(t.completedDate)).forEach(t=>{
    const d=t.completedDate;
    if(!groups[d])groups[d]=[];
    groups[d].push(t);
  });
  const dates=Object.keys(groups).sort().reverse();
  document.getElementById("completedHistory").innerHTML=dates.length?dates.map(d=>`
    <div class="completed-day">
      <h3>${new Date(d+"T12:00:00").toLocaleDateString(undefined,{weekday:"long",month:"long",day:"numeric",year:"numeric"})}</h3>
      <div class="task-list">${ordered(groups[d]).map(renderTask).join("")}</div>
    </div>`).join(""):`<div class="empty">Completed tasks will appear here by date. Uncheck any task to move it back.</div>`;
}
function buildCalendarHTML(large=false){
  const now=new Date(), y=now.getFullYear(), m=now.getMonth();
  const first=new Date(y,m,1), days=new Date(y,m+1,0).getDate();
  let cells=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"].map(d=>`<div class="dow">${d}</div>`);
  for(let i=0;i<first.getDay();i++)cells.push("<div></div>");
  for(let d=1;d<=days;d++){
    const date=iso(new Date(y,m,d));
    const has=DailyFlowOrder.activeTasksForDate(tasks,date,date===getToday()).length>0 || tasks.some(t=>t.completedDate===date);
    cells.push(`<div class="date-cell ${date===getToday()?"today":""} ${date===selectedDate?"selected":""} ${has?"has-task":""}" onclick="selectCalendarDate('${date}')">${d}</div>`);
  }
  return `<div class="calendar-grid">${cells.join("")}</div>`;
}
function renderCalendar(){
  const now=new Date();
  document.getElementById("monthLabel").textContent=now.toLocaleDateString(undefined,{month:"long",year:"numeric"});
  document.getElementById("miniCalendar").innerHTML=buildCalendarHTML();
  document.getElementById("largeCalendar").innerHTML=buildCalendarHTML(true);
}
function renderDeadlines(){
  const upcoming=tasks.filter(t=>!isTaskDone(t) && t.due>=getToday()).sort((a,b)=>a.due.localeCompare(b.due)).slice(0,4);
  document.getElementById("deadlineList").innerHTML=upcoming.length?upcoming.map(t=>`
    <div class="deadline"><div class="dot"></div><div><strong>${escapeHtml(t.title)}</strong><small>${t.due} · ${t.category}</small></div></div>`).join(""):`<div style="color:var(--muted);font-size:14px">No upcoming deadlines.</div>`;
}
function renderTimeline(){
  const rows=ordered(tasks.filter(t=>t.due>=getToday())).slice(0,8).map(t=>{
    const start=new Date(t.start), due=new Date(t.due);
    const span=Math.max(1,Math.round((due-start)/86400000)+1);
    const width=Math.min(100,15+span*8);
    return `<div class="timeline-row"><div><strong>${escapeHtml(t.title)}</strong><div style="font-size:12px;color:var(--muted)">${t.start} → ${t.due}</div></div><div class="bar-bg"><div class="bar" style="width:${width}%"></div></div></div>`;
  }).join("");
  document.getElementById("timelineRows").innerHTML=rows||`<div class="empty">No timeline tasks.</div>`;
}

const modal=document.getElementById("taskModal");
function renderPendingSubtasks(){
  pendingSubtasks=DailyFlowOrder.normalizeItemOrder(pendingSubtasks);
  document.getElementById("subtaskTags").innerHTML=pendingSubtasks.map((x,i)=>`<span class="subtask-tag">
    <button type="button" title="Move earlier" onclick="movePendingSubtask(${i},-1)" style="border:0;background:transparent;color:#6653c5;font-weight:800" ${i===0?"disabled":""}>↑</button>
    <button type="button" title="Move later" onclick="movePendingSubtask(${i},1)" style="border:0;background:transparent;color:#6653c5;font-weight:800" ${i===pendingSubtasks.length-1?"disabled":""}>↓</button>
    ${escapeHtml(x.title)} <button type="button" onclick="removePendingSubtask(${i})" style="border:0;background:transparent;color:#6653c5;font-weight:800">×</button></span>`).join("");
}
window.removePendingSubtask=i=>{ pendingSubtasks.splice(i,1); renderPendingSubtasks(); };
window.movePendingSubtask=(i,direction)=>{
  const target=i+direction;
  if(target<0 || target>=pendingSubtasks.length)return;
  [pendingSubtasks[i],pendingSubtasks[target]]=[pendingSubtasks[target],pendingSubtasks[i]];
  pendingSubtasks=pendingSubtasks.map((item,index)=>({...item,order:index}));
  renderPendingSubtasks();
};
function resetForm(){
  ["taskName","notes","subtaskInput"].forEach(id=>document.getElementById(id).value="");
  refreshCategoryField("School");
  document.getElementById("newCategoryName").value="";
  document.getElementById("priority").value="Medium";
  document.getElementById("focus").value="false";
  pendingSubtasks=[]; renderPendingSubtasks();
}
function openModal(task=null){
  modal.classList.add("open");
  editingTaskId=task?.id||null;
  document.getElementById("modalTitle").textContent=task?"Edit Task":"Add a Task";
  document.getElementById("saveTask").textContent=task?"Save Changes":"Save Task";
  if(task){
    document.getElementById("taskName").value=task.title;
    document.getElementById("startDate").value=task.start;
    document.getElementById("dueDate").value=task.due;
    refreshCategoryField(task.category);
    document.getElementById("priority").value=task.priority;
    document.getElementById("focus").value=String(Boolean(task.focus));
    document.getElementById("notes").value=task.notes||"";
    pendingSubtasks=(task.subtasks||[]).map(x=>({...x}));
  }else{
    resetForm();
    document.getElementById("startDate").value=selectedDate;
    document.getElementById("dueDate").value=selectedDate;
  }
  renderPendingSubtasks();
}
window.editTask=id=>{ const task=tasks.find(x=>x.id===id); if(task)openModal(task); };
function closeModal(){modal.classList.remove("open"); editingTaskId=null; resetForm();}
document.getElementById("openModal").onclick=()=>openModal();
document.getElementById("closeModal").onclick=closeModal;
document.getElementById("cancelModal").onclick=closeModal;
modal.addEventListener("click",e=>{if(e.target===modal)closeModal()});
document.getElementById("category").addEventListener("change",e=>{
  pendingCategoryColor=categoryColor(e.target.value);
  renderCategoryColorPicker();
});

document.getElementById("saveNewCategory").onclick=()=>{
  const input=document.getElementById("newCategoryName");
  const name=input.value.trim();
  if(!name){showToast("Enter a category name");return;}
  if(DailyFlowInlineEdit.addCategory(settings.categories,name)){
    settings.categories=DailyFlowInlineEdit.normalizeCategories(settings.categories,tasks);
    settings.categoryColors=DailyFlowInlineEdit.normalizeCategoryColors(settings.categoryColors,settings.categories);
    settings.categoryColors[name]=DailyFlowInlineEdit.normalizeHexColor(pendingCategoryColor) || "#e7f5ff";
    save(); refreshCategoryField(name); input.value=""; render(); showToast("Category saved");
  }else{
    const existing=settings.categories.find(c=>c.toLowerCase()===name.toLowerCase());
    refreshCategoryField(existing||"School"); input.value=""; showToast("Category already saved");
  }
};

document.getElementById("addSubtask").onclick=()=>{
  const input=document.getElementById("subtaskInput");
  const val=input.value.trim(); if(!val)return;
  pendingSubtasks.push({id:crypto.randomUUID(),title:val,done:false,order:pendingSubtasks.length}); input.value=""; renderPendingSubtasks();
};
document.getElementById("saveTask").onclick=()=>{
  const title=document.getElementById("taskName").value.trim();
  if(!title){showToast("Please enter a task name");return}
  const start=document.getElementById("startDate").value||selectedDate;
  const due=document.getElementById("dueDate").value||start;
  const chosenCategory=document.getElementById("category").value;
  DailyFlowInlineEdit.addCategory(settings.categories,chosenCategory);
  settings.categories=DailyFlowInlineEdit.normalizeCategories(settings.categories,tasks);
  settings.categoryColors=DailyFlowInlineEdit.normalizeCategoryColors(settings.categoryColors,settings.categories);
  settings.categoryColors[chosenCategory]=DailyFlowInlineEdit.normalizeHexColor(pendingCategoryColor) || settings.categoryColors[chosenCategory] || "#e7f5ff";
  const data={
    title,start,due,category:chosenCategory,
    priority:document.getElementById("priority").value,
    focus:document.getElementById("focus").value==="true",notes:document.getElementById("notes").value,
    subtasks:DailyFlowOrder.normalizeItemOrder(pendingSubtasks)
  };
  if(editingTaskId){
    const t=tasks.find(x=>x.id===editingTaskId);
    if(t){Object.assign(t,data); syncTaskCompletion(t); t.completedDate=isTaskDone(t)?(t.completedDate||getToday()):null;}
  }else{
    tasks.push({id:crypto.randomUUID(),completed:false,completedDate:null,order:tasks.length,...data});
  }
  const wasEditing=Boolean(editingTaskId);
  save();closeModal();render();showToast(wasEditing?"Task updated":"Task added");
};

document.querySelectorAll(".filter-btn").forEach(b=>b.onclick=()=>{
  document.querySelectorAll(".filter-btn").forEach(x=>x.classList.remove("active"));
  b.classList.add("active");currentFilter=b.dataset.filter;render();
});
document.querySelectorAll(".nav-btn").forEach(b=>b.onclick=()=>{
  document.querySelectorAll(".nav-btn").forEach(x=>x.classList.remove("active"));
  b.classList.add("active");
  document.querySelectorAll(".view").forEach(v=>v.classList.remove("active"));
  document.getElementById(b.dataset.view+"View").classList.add("active");
  if(b.dataset.view==="today"){
    followRealToday=true;
    selectedDate=getToday();
    updateSelectedDateHeader();
  }else{
    document.getElementById("pageTitle").textContent=b.textContent.trim().replace(/\d+$/," ").trim();
    document.getElementById("dateText").textContent="";
  }
  render();
});
document.getElementById("archiveDay").onclick=()=>{
  const before=tasks.filter(t=>!t.completedDate && t.start<=selectedDate && isTaskDone(t)).length;
  tasks=DailyFlowOrder.finishDay(tasks,selectedDate);
  save();render();
  if(before){
    showToast(`${before} checked task${before===1?"":"s"} moved to Completed. Unfinished tasks will carry forward.`);
  }else{
    showToast("No checked tasks to move. Unfinished tasks will carry forward.");
  }
};
document.getElementById("toggleTimeline").onclick=()=>{
  const p=document.getElementById("timelinePanel");
  const open=p.style.display!=="none"; p.style.display=open?"none":"block";
  document.getElementById("toggleTimeline").textContent=open?"Show Timeline":"Hide Timeline";
};

function checkRealDateRollover(){
  const nowToday=getToday();
  if(nowToday===lastKnownToday)return;
  const previousToday=lastKnownToday;
  lastKnownToday=nowToday;
  if(followRealToday && selectedDate===previousToday){
    selectedDate=nowToday;
    updateSelectedDateHeader();
    render();
    showToast("A new day has started. Unfinished tasks carried forward.");
  }
}
setInterval(checkRealDateRollover,60000);
window.addEventListener("focus",checkRealDateRollover);
document.addEventListener("visibilitychange",()=>{if(!document.hidden)checkRealDateRollover();});

updateSelectedDateHeader();
normalizeOrder(); save(); render();
</script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('./service-worker.js'));
}
</script>
